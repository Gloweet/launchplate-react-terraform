name: Production - Terraform Plan

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  ENVIRONMENT: ${environment}
  aws_region: eu-west-3
  tf_version: "1.12.1"
  working_dir_tf: "terraform/live"
  tf_plugin_cache_dir: ${{ github.workspace }}/.terraform.d/plugin-cache

concurrency:
  group: ${repo_name}-production
  cancel-in-progress: false

permissions:
  # Allows the workflow to request an OIDC token
  id-token: write

  # Required for actions/checkout
  contents: read

jobs:
  Check:
    name: TF Check
    runs-on: ["ubuntu-latest"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform Cache
        uses: ./.github/actions/setup-tf-cache
        with:
          cache-path: ${{ env.tf_plugin_cache_dir }}

      - name: Terraform Format Check
        run: |
          cd ${{ env.working_dir_tf }}
          terraform fmt -check -recursive

  Plan:
    name: TF Plan
    runs-on: ["ubuntu-latest"]
    needs: [Check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform Cache
        uses: ./.github/actions/setup-tf-cache
        with:
          cache-path: ${{ env.tf_plugin_cache_dir }}

      - name: Setup AWS
        uses: ./.github/actions/setup-aws
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.tf_version }}

      - name: Terraform Init
        run: |
          cd ${{ env.working_dir_tf }}
          terraform init --backend-config=backend-configs/production.tf

      - name: Terraform Workspace
        run: |
          cd ${{ env.working_dir_tf }}
          terraform workspace select 'production' || terraform workspace new 'production'

      - name: Terraform Plan
        env:

          TF_VAR_TERRAFORM_VERSION: ${{ vars.TERRAFORM_VERSION }}
          
          TF_VAR_AWS_REGION: ${{ vars.AWS_REGION }}
          

          TF_VAR_AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          
          TF_VAR_ORG_TOKEN: ${{ secrets.ORG_TOKEN }}
          
          TF_VAR_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          
          TF_VAR_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          
        run: |
          cd ${{ env.working_dir_tf }}
          terraform plan -out=tfplan -lock=false
